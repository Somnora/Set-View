<!doctype html>
<!-- The storage fallback is temporary, in a real browser's IndexedDB.
     ScanStore, PropStore and BlobStore run against Chrome's own IndexedDB through a thin
     wrapper that sends them to throwaway databases at version 2. This page first
     opens those databases at version 1 and keeps the connections, so the stores'
     opens are blocked (another tab holding an older version is a real cause of
     a late open). Then:
       1. while blocked, a scan, a prop and an imported original are put: each
          reports not saved and says it is held in memory until storage opens;
       2. the page closes its old connections: the opens finish late, the stores
          adopt them, write what they held and send a notice;
       3. fresh stores (a later session) read all three back from IndexedDB.
     The throwaway databases are deleted afterwards. The app's own data is not touched.
     Headed (vite.http.config.ts): http://localhost:5174/test/storage-late-open-smoke.html -->
<html>
  <head><meta charset="utf-8" /><title>storage late open smoke</title></head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import { ScanStore } from '../src/scanStore.ts';
      import { PropStore } from '../src/propStore.ts';
      import { BlobStore } from '../src/blobStore.ts';

      const out = document.getElementById('out');
      const report = (ok, msg) => {
        out.textContent = `LATE-OPEN-SMOKE ${ok ? 'PASS' : 'FAIL'} | ${msg}`;
        out.style.color = ok ? '#060' : '#a00';
      };
      const until = async (fn, ms = 10000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          const v = await fn();
          if (v) return v;
          await new Promise((r) => setTimeout(r, 25));
        }
        return null;
      };
      const SUFFIX = '-late-open-smoke';
      // Every store open goes to "<name>-late-open-smoke" at version 2.
      const wrapper = { open: (name) => indexedDB.open(name + SUFFIX, 2) };
      const openV1 = (name) =>
        new Promise((resolve, reject) => {
          const req = indexedDB.open(name + SUFFIX, 1);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      const dropDb = (name) =>
        new Promise((resolve) => {
          const req = indexedDB.deleteDatabase(name + SUFFIX);
          req.onsuccess = req.onerror = req.onblocked = () => resolve();
        });
      const scan = {
        version: 1,
        id: 'late-open-scan',
        capturedAt: Date.now(),
        meshes: [{ label: 'm', positions: new Float32Array([0, 0, 0, 1, 0, 0, 0, 1, 0]), indices: new Uint32Array([0, 1, 2]) }],
      };
      const asset = {
        id: 'late-open-asset',
        name: 'Console',
        fileName: 'console.glb',
        fileType: 'glb',
        category: 'custom',
        sizeBytes: 4,
        uploadedAt: 1,
        dimensions: { width: 1, height: 1, depth: 1 },
        buffer: new Uint8Array([1, 2, 3, 4]).buffer,
      };
      const notes = [];
      let held = [];
      try {
        await dropDb('setview');
        await dropDb('setview_assets');
        await dropDb('setview_blobs');
        // Old-version connections that ignore versionchange: the stores' opens are blocked.
        held = [await openV1('setview'), await openV1('setview_assets'), await openV1('setview_blobs')];

        const opts = { indexedDB: wrapper, openTimeoutMs: 1500 };
        const scans = new ScanStore(opts);
        const props = new PropStore(opts);
        const blobs = new BlobStore(opts);
        const warnings = [];
        const notices = [];
        scans.onError = props.onError = blobs.onError = (m) => warnings.push(m);
        scans.onNotice = props.onNotice = blobs.onNotice = (m) => notices.push(m);

        // 1. Blocked.
        const t0 = performance.now();
        const scanSaved = await scans.putScan(scan);
        const blockedMs = Math.round(performance.now() - t0);
        const propSaved = await props.putAsset(asset);
        const blob = await blobs.putBlob({ id: 'late-open-blob', data: new Uint8Array([5, 6, 7]), format: 'glb', name: 'room.glb' });
        const step1 =
          scanSaved === false &&
          propSaved === false &&
          blob.saved === false &&
          scans.storageState === 'waiting' &&
          props.storageState === 'waiting' &&
          blobs.storageState === 'waiting' &&
          warnings.length === 3 &&
          warnings.every((w) => /held in memory and saved when it opens/.test(w));
        notes.push(`blocked: saved=${scanSaved}/${propSaved}/${blob.saved} state=${scans.storageState}/${props.storageState}/${blobs.storageState} fellBackIn=${blockedMs}ms warnings=${warnings.length}`);

        // 2. Let go: the opens finish late and the stores write what they held.
        for (const db of held) db.close();
        held = [];
        const opened = await Promise.all([scans.whenStorageOpens(), props.whenStorageOpens(), blobs.whenStorageOpens()]);
        const gotNotices = await until(() => notices.length >= 3);
        const step2 = opened.every(Boolean) && !!gotNotices && scans.storageState === 'open';
        notes.push(`late open: opened=${opened} notices=${JSON.stringify(notices)}`);

        // 3. A later session reads both back from IndexedDB.
        const scans2 = new ScanStore(opts);
        const props2 = new PropStore(opts);
        const blobs2 = new BlobStore(opts);
        const back = await scans2.getScan(scan.id);
        const backAsset = await props2.getAsset(asset.id);
        const backBytes = await blobs2.getBytes('late-open-blob');
        const step3 =
          !!back &&
          back.meshes[0].positions instanceof Float32Array &&
          back.meshes[0].positions[3] === 1 &&
          !!backAsset &&
          new Uint8Array(backAsset.buffer)[3] === 4 &&
          !!backBytes &&
          new Uint8Array(backBytes)[2] === 7;
        notes.push(`later session: scan=${!!back} prop=${!!backAsset} original=${!!backBytes}`);

        report(step1 && step2 && step3, notes.join(' | '));
      } catch (e) {
        report(false, `${e.message} | ${notes.join(' | ')}`);
      } finally {
        for (const db of held) db.close();
        await dropDb('setview');
        await dropDb('setview_assets');
        await dropDb('setview_blobs');
      }
    </script>
  </body>
</html>
