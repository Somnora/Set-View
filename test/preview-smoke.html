<!doctype html>
<!-- Headless-verifiable smoke for the desktop preview: builds a scene with
     stances + a walk-to-chair-and-sit path + a camera, opens DesktopPreview,
     scrubs to the end (actor seated at the chair), and renders. Run:

       chrome --headless=new --disable-gpu --ignore-certificate-errors \
         --enable-unsafe-swiftshader --window-size=1280,800 \
         --virtual-time-budget=9000 \
         --screenshot=preview-smoke.png https://localhost:5173/test/preview-smoke.html

     Inspect the PNG: grid + three posed gray-box actors (one seated at the
     end of a dotted path, one lying, one standing) + a camera gizmo + the
     preview toolbar. The <pre> also reports PREVIEW-SMOKE PASS/FAIL.

     ?scan adds the synthetic test room the way a reload restores it (scene
     JSON normalized, so locationMode defaults to Ghost) and asserts it is
     visible and that the toolbar's Room button cycles the display mode.

     ?walls adds three walls of a room around the actors (a window in the back
     wall, a door in the left wall, the open side toward the camera) through
     ArchitectureRenderer, and asserts flat Lambert materials, the merged mesh
     count (8: plain wall 1, window wall 3, door wall 4) and the draw calls one
     frame of walls costs. -->
<html>
  <head><meta charset="utf-8" /><title>desktop preview smoke</title>
  <link rel="stylesheet" href="../src/style.css" /></head>
  <body>
    <pre id="out" style="position:fixed;top:8px;left:8px;z-index:20;color:#9f6">running…</pre>
    <script type="module">
      import * as THREE from 'three';
      import { addKeyframe, createActor, createCameraSetup, createScene, normalizeScene } from '../src/model.ts';
      import { SessionManager } from '../src/session.ts';
      import { ActorManager } from '../src/actors.ts';
      import { KeyframeSystem } from '../src/keyframes.ts';
      import { DesktopPreview } from '../src/preview.ts';
      // ?scan fixtures. Imported statically so the module graph is loaded
      // before the first frame (keeps the run inside the virtual-time budget).
      import { LocationRenderer } from '../src/location.ts';
      import { createSyntheticLocationScan } from '../src/scanExporters.ts';
      import { summarizeScan } from '../src/scan.ts';
      import { createArchitecturalSet, createDoorData, createWallData, createWindowData } from '../src/architecture.ts';
      import { ArchitectureRenderer } from '../src/architectureRenderer.ts';

      const out = document.getElementById('out');
      try {
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.inset = '0';
        document.body.appendChild(renderer.domElement);

        const scene3 = new THREE.Scene();
        scene3.add(new THREE.HemisphereLight(0xffffff, 0x3a4152, 1.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(1.5, 3, 1);
        scene3.add(sun);
        const contentRoot = new THREE.Group();
        scene3.add(contentRoot);

        const params = new URLSearchParams(location.search);
        const scene = createScene('preview smoke');
        if (params.has('gallery')) {
          // All 10 stances in a row, facing +Z (toward the default camera side)
          // — a one-screenshot pose review, no headset needed.
          const { STANCES } = await import('../src/pose.ts');
          // 2.4 m apart: a lying body is ~1.7 m long, so tighter spacing
          // overlaps the four lying poses.
          STANCES.forEach((p, i) => {
            const a = createActor(scene, { x: (i - (STANCES.length - 1) / 2) * 2.4, y: 0, z: 0 }, 0);
            a.stance = p.id;
            a.name = p.short;
          });
        } else {
          // A seated diner, a lying figure, and a walker who sits.
          const seated = createActor(scene, { x: -1.2, y: 0, z: 0 }, 0.4);
          seated.stance = 'seated-chair';
          const lying = createActor(scene, { x: 3.2, y: 0, z: -0.6 }, -0.8);
          lying.stance = 'lying-left';
          const walker = createActor(scene, { x: 0, y: 0, z: 1.6 }, 0);
          addKeyframe(walker, { x: 0, y: 0, z: 1.6 }, 0, 'standing');
          addKeyframe(walker, { x: 0.9, y: 0, z: -1.2 }, 0, 'standing');
          addKeyframe(walker, { x: 0.9, y: 0, z: -1.2 }, 1.2, 'seated-chair');
          createCameraSetup(scene, { x: -2.4, y: 1.5, z: 2.4 }, { x: 0, y: 0.38, z: 0, w: 0.925 }, 35, '2.39:1');
        }

        const session = new SessionManager(renderer, () => {});
        const actors = new ActorManager(session, scene);
        contentRoot.add(actors.group);
        actors.setScene(scene);
        const keyframes = new KeyframeSystem(scene, actors);
        contentRoot.add(keyframes.vizGroup);
        keyframes.setScene(scene);

        const preview = new DesktopPreview(renderer, scene3, contentRoot, keyframes, []);
        let scanLoc = null;
        if (params.has('scan')) {
          const room = createSyntheticLocationScan(6, 5, 2.8, ['couch', 'table', 'desk']);
          scene.scan = summarizeScan(room);
          // What a reload does: the saved JSON is normalized (no mode saved yet).
          const reloaded = normalizeScene(JSON.parse(JSON.stringify(scene)));
          scanLoc = new LocationRenderer();
          contentRoot.add(scanLoc.group);
          scanLoc.setMode(reloaded.locationMode ?? 'hidden');
          scanLoc.setScan(room);
          preview.getLocationMode = () => scanLoc.mode;
          preview.onCycleLocationMode = () => scanLoc.cycleMode();
        }
        let walls = null;
        if (params.has('walls')) {
          // Back wall at z = -3 with a window, left wall at x = -3.5 with a door, right wall at x = 4.
          scene.architecture = createArchitecturalSet('smoke room', {
            walls: [
              createWallData({ name: 'Back', start: { x: -3.5, y: 0, z: -3 }, end: { x: 4, y: 0, z: -3 }, heightM: 2.7, thicknessM: 0.12,
                windows: [createWindowData({ type: 'sash', offsetAlongWallM: 4.2, widthM: 1.4, heightM: 1.3 })] }),
              createWallData({ name: 'Left', start: { x: -3.5, y: 0, z: 3 }, end: { x: -3.5, y: 0, z: -3 }, heightM: 2.7, thicknessM: 0.12,
                doors: [createDoorData({ type: 'single_swing', offsetAlongWallM: 3.6, widthM: 0.9, heightM: 2.1, openAngleDeg: 30 })] }),
              createWallData({ name: 'Right', start: { x: 4, y: 0, z: -3 }, end: { x: 4, y: 0, z: 1.5 }, heightM: 2.7, thicknessM: 0.12, tintHex: '#cbd5e1' }),
            ],
          });
          walls = new ArchitectureRenderer();
          contentRoot.add(walls.group);
          walls.setArchitecture(normalizeScene(JSON.parse(JSON.stringify(scene))).architecture);
        }
        // ?focus=x,z zooms the orbit onto one spot (stance close-ups).
        const focus = params.get('focus');
        let bounds = new THREE.Box3(new THREE.Vector3(-2, 0, -2), new THREE.Vector3(2, 1.8, 2.2));
        if (params.has('gallery')) {
          bounds = new THREE.Box3(new THREE.Vector3(-11.5, 0, -1), new THREE.Vector3(11.5, 1.9, 1));
        } else if (walls) {
          bounds = new THREE.Box3(new THREE.Vector3(-3.6, 0, -3.1), new THREE.Vector3(4.1, 2.7, 3));
        } else if (focus) {
          const [fx, fz] = focus.split(',').map(Number);
          bounds = new THREE.Box3(new THREE.Vector3(fx - 0.8, 0, fz - 0.8), new THREE.Vector3(fx + 0.8, 1.6, fz + 0.8));
        }
        preview.open(scene, bounds);
        if (params.has('gallery')) {
          // Head-on elevation instead of the orbit three-quarter view.
          preview['camera'].position.set(0, 1.1, 9.5);
          preview['controls'].target.set(0, 0.75, 0);
          preview['controls'].update();
        }
        // End of the move: the walker should be SEATED at the chair mark.
        keyframes.scrubTo(1);

        // Give the loop a few frames, then report.
        let frames = 0;
        const check = () => {
          frames++;
          if (frames < 10) return requestAnimationFrame(check);
          const gl = renderer.getContext();
          const err = gl.getError();
          let scanOk = true;
          let scanNote = '';
          if (scanLoc) {
            const roomBtn = [...document.querySelectorAll('.preview-bar button')].find((b) =>
              b.textContent.startsWith('Room:'),
            );
            const before = roomBtn?.textContent;
            roomBtn?.click();
            const after = roomBtn?.textContent;
            scanOk = scanLoc.group.visible && before === 'Room: Ghost' && after === 'Room: Solid';
            scanNote = ` scan visible=${scanLoc.group.visible} room=${before}->${after}`;
            roomBtn?.click(); // Wireframe
            roomBtn?.click(); // Hidden
            roomBtn?.click(); // back to Ghost for the screenshot
          }
          // Every toolbar button must be inside the window (the bar used to run off both edges).
          const offscreen = [...document.querySelectorAll('.preview-bar button')]
            .filter((b) => {
              const r = b.getBoundingClientRect();
              return r.left < 0 || r.right > innerWidth || r.top < 0 || r.bottom > innerHeight;
            })
            .map((b) => b.textContent.trim());
          if (offscreen.length) scanNote += ` offscreen=[${offscreen.join(', ')}]`;
          let wallsOk = true;
          if (walls) {
            const meshes = [];
            walls.group.traverse((o) => o.isMesh && meshes.push(o));
            const lambert = meshes.every((m) => m.material.type === 'MeshLambertMaterial' && !m.castShadow);
            // Draw calls for the walls alone, from the preview camera.
            const hidden = [];
            for (const c of contentRoot.children) if (c !== walls.group && c.visible) { c.visible = false; hidden.push(c); }
            for (const c of scene3.children) if (c !== contentRoot && !c.isLight && c.visible) { c.visible = false; hidden.push(c); }
            renderer.info.reset();
            renderer.info.autoReset = false;
            renderer.render(scene3, preview['camera']);
            const calls = renderer.info.render.calls;
            renderer.info.autoReset = true;
            for (const c of hidden) c.visible = true;
            wallsOk = walls.wallCount === 3 && meshes.length === 8 && lambert && calls <= meshes.length;
            scanNote += ` walls=${walls.wallCount} meshes=${meshes.length} lambert=${lambert} wallDrawCalls=${calls}`;
          }
          const ok =
            err === 0 &&
            preview.active &&
            document.querySelector('.preview-bar') !== null &&
            offscreen.length === 0 &&
            scanOk &&
            wallsOk &&
            (params.has('gallery') || keyframes.duration > 0); // gallery has no moves
          out.textContent = ok
            ? `PREVIEW-SMOKE PASS${scanLoc ? ' (scan)' : ''}${walls ? ` (walls)${scanNote}` : ''}`
            : `PREVIEW-SMOKE FAIL: glError=${err} active=${preview.active} dur=${keyframes.duration}${scanNote}`;
          out.style.color = ok ? '#9f6' : '#f66';
        };
        requestAnimationFrame(check);
      } catch (e) {
        out.textContent = `PREVIEW-SMOKE FAIL: ${e.message}`;
        out.style.color = '#f66';
      }
    </script>
  </body>
</html>
